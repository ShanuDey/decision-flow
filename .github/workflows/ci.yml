name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv --directory api sync --frozen
      - run: pnpm --dir web install --frozen-lockfile
      - run: make checks
      - name: Generated client matches the committed one
        run: |
          if [ -n "$(git status --porcelain -- api/openapi.json web/src/lib/api)" ]; then
            git status --short -- api/openapi.json web/src/lib/api
            echo "API client is out of date: run 'make client' and commit the result."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Python vulnerabilities
        run: |
          uv --directory api export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: JavaScript vulnerabilities
        run: pnpm --dir web audit --prod
