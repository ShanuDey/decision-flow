name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - marketplace/**
      - api/app/connections/data/**
      - api/app/node_templates/data/**
      - api/openapi.json
      - web/src/lib/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - name: Build for the app rewrite (/docs)
        run: pnpm --dir docs build
        env:
          DOCS_NOINDEX: "1"
      - name: Build for the Pages root (/decision-flow)
        run: pnpm --dir docs build
        env:
          DOCS_BASE: ${{ github.event.repository.name }}
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          DOCS_OUT: dist-direct
      - name: Assemble the Pages site
        run: |
          mkdir -p _site/embed
          cp -r docs/dist-direct/. _site/
          cp -r docs/dist _site/embed/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
