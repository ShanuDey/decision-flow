# Deployment file (published image); copy it with a .env to a host or Dockge. Dev: docker-compose.dev.yml.
# .env: POSTGRES_PASSWORD (required; letters and digits only, it goes into URLs).
# Optional: POSTGRES_USER, POSTGRES_DB (default decisionflow), MLFLOW_TRACKING_URI, MLFLOW_SET_EXPERIMENT, APP_VERSION, WEB_URL, WEB_PORT, API_PORT.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisionflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-decisionflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/shanudey/decision-flow:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decisionflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-decisionflow}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3000}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_SET_EXPERIMENT: ${MLFLOW_SET_EXPERIMENT:-decision-flow}
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
