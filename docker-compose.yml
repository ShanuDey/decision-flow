services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: decisionflow
      POSTGRES_PASSWORD: decisionflow
      POSTGRES_DB: decisionflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://decisionflow:decisionflow@db:5432/decisionflow
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
